@if (isAuthenticated()) {
  <header class="navbar">
    <div class="navbar__inner">
      <a class="navbar__brand" routerLink="/grafo" (click)="closeMenu()" aria-label="MalhaAI — início">
        <img class="navbar__logo" src="/M-logo.png" width="40" height="40" alt="" />
        <span class="navbar__wordmark">Malha<span class="accent">AI</span></span>
      </a>

      <button
        class="navbar__toggle"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Abrir menu"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="navbar__nav" [class.is-open]="menuOpen()">
        @for (link of links(); track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        }
      </nav>

      <div class="navbar__user" [class.is-open]="menuOpen()">
        <div class="navbar__identity">
          <span class="navbar__email" [title]="label()">{{ label() }}</span>
          <span class="navbar__role">{{ papelLabel() }}</span>
        </div>
        <app-botao variant="outline" (clicked)="logout()">Sair</app-botao>
      </div>
    </div>
  </header>
}
