<div class="auth-screen">
  <div class="auth-wrap">
    <header class="auth-brand">
      <img
        class="auth-brand__logo"
        src="/MalhaAI-logo.png"
        width="320"
        height="120"
        alt="MalhaAI — Planejador de Grade Curricular"
      />
      <p class="auth-tagline">Encontre o melhor caminho na sua grade</p>
    </header>

    <section class="auth-panel" aria-labelledby="login-title">
      <header class="auth-panel__header">
        <h2 id="login-title">Entrar</h2>
        <p>Use o e-mail da sua conta MalhaAI</p>
      </header>

      <form class="auth-form" (ngSubmit)="submit()">
        <app-input
          label="E-mail"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="seu@email.com"
          [required]="true"
          [(value)]="email"
        />
        <app-input
          label="Senha"
          type="password"
          name="senha"
          autocomplete="current-password"
          placeholder="••••••••"
          [required]="true"
          [(value)]="senha"
        />

        @if (erro()) {
          <p class="auth-error" role="alert">{{ erro() }}</p>
        }

        <div class="auth-form__actions">
          <app-botao
            type="submit"
            variant="accent"
            [fullWidth]="true"
            [loading]="loading()"
            [disabled]="loading()"
          >
            Entrar
          </app-botao>
        </div>
      </form>

      <p class="auth-footer">
        Não tem conta?
        <a routerLink="/cadastro">Criar conta</a>
      </p>
    </section>
  </div>
</div>
