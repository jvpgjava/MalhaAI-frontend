<div class="auth-screen auth-screen--cadastro">
  <div class="auth-wrap">
    <header class="auth-brand">
      <img
        class="auth-brand__logo"
        src="/MalhaAI-logo.png"
        width="420"
        height="158"
        alt="MalhaAI — Planejador de Grade Curricular"
      />
    </header>

    <section class="auth-panel" aria-labelledby="cadastro-title">
      <header class="auth-panel__header">
        <h2 id="cadastro-title">Criar conta</h2>
      </header>

      <form class="auth-form" (ngSubmit)="submit()">
        <app-input
          label="Nome completo"
          name="nome"
          autocomplete="name"
          placeholder="Seu nome"
          [(value)]="nome"
        />
        <app-input
          label="E-mail"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="seu@email.com"
          [required]="true"
          [(value)]="email"
        />
        <app-input
          label="Senha"
          type="password"
          name="senha"
          autocomplete="new-password"
          placeholder="••••••••"
          [required]="true"
          [(value)]="senha"
        />
        <app-input
          label="Confirmar senha"
          type="password"
          name="confirmar"
          autocomplete="new-password"
          placeholder="••••••••"
          [required]="true"
          [(value)]="confirmarSenha"
        />

        @if (erro()) {
          <p class="auth-error" role="alert">{{ erro() }}</p>
        }

        <div class="auth-form__actions">
          <app-botao
            type="submit"
            variant="accent"
            [fullWidth]="true"
            [loading]="loading()"
            [disabled]="loading()"
          >
            Cadastrar
          </app-botao>
        </div>
      </form>

      <p class="auth-footer">
        Já tem conta?
        <a routerLink="/login">Entrar</a>
      </p>
    </section>
  </div>
</div>
