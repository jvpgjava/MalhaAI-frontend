<div class="auth-screen">
  <div class="auth-wrap">
    <header class="auth-brand">
      <p class="auth-kicker">Planejador curricular</p>
      <h1 class="auth-logo">Malha<span class="accent">IA</span></h1>
      <p class="auth-tagline">Monte sua trajetória com clareza</p>
    </header>

    <section class="auth-panel" aria-labelledby="cadastro-title">
      <header class="auth-panel__header">
        <h2 id="cadastro-title">Criar conta</h2>
        <p>Leva menos de um minuto para começar</p>
      </header>

      <form class="auth-form" (ngSubmit)="submit()">
        <app-input
          label="Nome completo"
          name="nome"
          autocomplete="name"
          placeholder="Seu nome"
          [(value)]="nome"
        />
        <app-input
          label="E-mail"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="seu@email.com"
          [required]="true"
          [(value)]="email"
        />
        <app-input
          label="Senha"
          type="password"
          name="senha"
          autocomplete="new-password"
          placeholder="••••••••"
          [required]="true"
          [(value)]="senha"
        />
        <app-input
          label="Confirmar senha"
          type="password"
          name="confirmar"
          autocomplete="new-password"
          placeholder="••••••••"
          [required]="true"
          [(value)]="confirmarSenha"
        />

        <div>
          <p class="papel-label">Papel</p>
          <div class="papel-grid">
            <button
              type="button"
              class="papel-card"
              [class.selected]="papel() === 'ALUNO'"
              (click)="selecionarPapel('ALUNO')"
            >
              Aluno
              <small>Progresso, grafo e REA</small>
            </button>
            <button
              type="button"
              class="papel-card"
              [class.selected]="papel() === 'COORDENACAO'"
              (click)="selecionarPapel('COORDENACAO')"
            >
              Coordenação
              <small>Oferta do semestre</small>
            </button>
          </div>
        </div>

        @if (erro()) {
          <p class="auth-error" role="alert">{{ erro() }}</p>
        }

        <div class="auth-form__actions">
          <app-botao
            type="submit"
            variant="accent"
            [fullWidth]="true"
            [loading]="loading()"
            [disabled]="loading()"
          >
            Cadastrar
          </app-botao>
        </div>
      </form>

      <p class="auth-footer">
        Já tem conta?
        <a routerLink="/login">Entrar</a>
      </p>
    </section>
  </div>
</div>
