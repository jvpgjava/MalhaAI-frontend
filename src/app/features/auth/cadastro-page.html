<div class="auth-screen">
  <div class="auth-wrap">
    <header class="auth-brand">
      <img class="auth-brand__mark" src="/M-logo.png" width="72" height="72" alt="" />
      <p class="auth-kicker">Planejador curricular</p>
      <p class="auth-tagline">Crie sua conta de estudante</p>
    </header>

    <section class="auth-panel" aria-labelledby="cadastro-title">
      <header class="auth-panel__header">
        <h2 id="cadastro-title">Criar conta</h2>
        <p>
          O cadastro público é para <strong>Estudante</strong>. Professor, Coordenação e Dev são
          criados pelo painel Contas (DEV).
        </p>
      </header>

      <form class="auth-form" (ngSubmit)="submit()">
        <app-input
          label="Nome completo"
          name="nome"
          autocomplete="name"
          placeholder="Seu nome"
          [(value)]="nome"
        />
        <app-input
          label="E-mail"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="seu@email.com"
          [required]="true"
          [(value)]="email"
        />
        <app-input
          label="Senha"
          type="password"
          name="senha"
          autocomplete="new-password"
          placeholder="••••••••"
          [required]="true"
          [(value)]="senha"
        />
        <app-input
          label="Confirmar senha"
          type="password"
          name="confirmar"
          autocomplete="new-password"
          placeholder="••••••••"
          [required]="true"
          [(value)]="confirmarSenha"
        />

        @if (erro()) {
          <p class="auth-error" role="alert">{{ erro() }}</p>
        }

        <div class="auth-form__actions">
          <app-botao
            type="submit"
            variant="accent"
            [fullWidth]="true"
            [loading]="loading()"
            [disabled]="loading()"
          >
            Cadastrar como estudante
          </app-botao>
        </div>
      </form>

      <p class="auth-footer">
        Já tem conta?
        <a routerLink="/login">Entrar</a>
      </p>
    </section>
  </div>
</div>
